name: Deploy

on:
  push:
    branches:
      - main
      - test-ci
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install accessibility auditor
        run: npm install poc-validador-acessibilidade --prefix accessibility-audit

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: accessibility-audit/node_modules/poc-validador-acessibilidade

      - name: Run accessibility audit
        run: |
          mkdir -p reports
          npm run audit --prefix accessibility-audit/node_modules/poc-validador-acessibilidade -- \
            --config "$GITHUB_WORKSPACE/audit.config.ci.json" \
            --out "$GITHUB_WORKSPACE/reports/consolidated-report.json" \
            --html "$GITHUB_WORKSPACE/reports/consolidated-report.html"

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: reports/
          if-no-files-found: ignore
